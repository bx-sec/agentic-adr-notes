title: AI Agent Weak User-Agent Keywords
id: 1211cf27-580a-422a-83ec-395ad8a4e482
status: experimental
description: |
    Broad AI-related keywords in user agents. These substrings may appear in
    benign software (e.g. 'claude' inside other product names), so this rule
    is informational and is intended to label traffic rather than alert on it.
    Use for enrichment and hunting, not for blocking.
    Marker list derived from AgentCapture signature/risk-engine word lists
    (snapshot 728ffa0).
references:
    - https://github.com/Tcotl/AgentCapture
author: agentic-adr-notes
date: 2026-11-25
tags:
    - attack.reconnaissance
    - attack.t1595.002
logsource:
    category: webserver
detection:
    selection:
        cs(User-Agent)|contains:
            - 'chatgpt'
            - 'gptbot'
            - 'oai-searchbot'
            - 'claude'
            - 'gpt-4'
            - 'llm'
            - 'ai-agent'
            - 'langchain'
            - 'crewai'
            - 'autogpt'
            - 'gemini'
            - 'kimi'
            - 'moonshot'
            - 'copilot'
    condition: selection
falsepositives:
    - Benign software whose name contains these keywords (e.g. GitHub Copilot editor traffic)
    - Legitimate AI crawlers that identify themselves (GPTBot, search bots)
level: low
