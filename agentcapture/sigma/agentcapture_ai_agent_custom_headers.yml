title: AI Agent Custom Request Headers
id: 4598d769-ffce-479c-9e81-ac29f1f1dc18
status: experimental
description: |
    Detects AI-infrastructure custom headers sent to a web server
    (x-openai, x-anthropic, x-langfuse, x-agent, x-automated). These headers
    are added by AI agent stacks themselves and identify AI-driven traffic
    regardless of what the user agent claims.
    Header list derived from AgentCapture AGENT_HEADER_CLUES (snapshot 728ffa0).
references:
    - https://github.com/Tcotl/AgentCapture
author: agentic-adr-notes
date: 2026-11-25
tags:
    - attack.reconnaissance
    - attack.t1592.002
logsource:
    category: webserver
detection:
    selection:
        # adjust header field names to your log pipeline (IIS: cs(...),
        # nginx: http_..., ECS: http.request.headers.*)
        x-openai|exists: true
    selection_alt:
        x-anthropic|exists: true
    selection_alt2:
        x-langfuse|exists: true
    selection_alt3:
        x-agent|exists: true
    selection_alt4:
        x-automated|exists: true
    condition: 1 of selection*
falsepositives:
    - Internal services that legitimately use these header names
level: medium
