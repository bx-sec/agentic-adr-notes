title: Honeypot Bait Route Access from AI Agent User-Agent
id: abefa950-de87-4c2d-b43c-e720a8a0e404
status: experimental
description: |
    Combines two strong signals: access to honeypot bait routes (fake backups,
    fake config dumps, agent instruction files, fake internal docs) AND an
    AI-agent user agent. Humans do not read agent instruction files from
    scripted clients; this combination is a high-confidence deception hit.
    Path and marker lists derived from AgentCapture risk-engine and
    counter-offense routes (snapshot 728ffa0).
references:
    - https://github.com/Tcotl/AgentCapture
author: agentic-adr-notes
date: 2026-11-25
tags:
    - attack.reconnaissance
    - attack.t1595.002
logsource:
    category: webserver
detection:
    selection_bait:
        c-uri|startswith:
            - '/archive/'
            - '/d/'
        c-uri:
            - '/AGENTS.md'
            - '/CLAUDE.md'
            - '/.cursorrules'
            - '/internal/openapi.json'
            - '/docs/runbook-internal.md'
            - '/archive/admin/staging-login'
    selection_ai_ua:
        cs(User-Agent)|contains:
            - 'codex'
            - 'claude'
            - 'opencode'
            - 'kimi'
            - 'cursor'
            - 'aider'
            - 'cline'
            - 'windsurf'
            - 'codebuddy'
            - 'junie'
            - 'gemini'
            - 'browser-use'
            - 'playwright'
            - 'puppeteer'
            - 'headlesschrome'
            - 'langchain'
            - 'crewai'
            - 'autogpt'
            - 'hexstrike'
            - 'strix'
            - 'pentagi'
            - 'pentestagent'
            - 'pentest-agent'
            - 'artex'
            - 'cyberstrikeai'
            - 'slingshoot'
            - 'sapper'
    condition: selection_bait and selection_ai_ua
falsepositives:
    - Authorized assessment drills that walk the bait routes on purpose
level: high
